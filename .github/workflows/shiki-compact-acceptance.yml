name: NPR compact history full acceptance
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/shiki-compact-acceptance.yml
      - rpg_engine/compaction.py
      - rpg_engine/engine.py
      - rpg_engine/history.py
      - rpg_engine/sessions.py
      - rpg_engine/verification.py
      - rpg_engine/transcripts.py
      - tests/test_compaction.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    if: github.repository == 'sifiroth-gif/NPR'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact source retrieval, full-text lexical search, and future close behavior
        run: python -m unittest discover -s tests -v
      - name: Verify published compacted Shiki checkpoint and full current scene
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/game-state/shiki:refs/remotes/origin/game-state/shiki
          git worktree add --detach "$RUNNER_TEMP/compact-readback" refs/remotes/origin/game-state/shiki
          python - <<'PY'
          import json,os
          from pathlib import Path
          from rpg_engine import Campaign,verification,git_state,compaction,sessions
          root=Path(os.environ["RUNNER_TEMP"])/"compact-readback"
          game=Campaign(root/"campaign.sqlite")
          manifest=json.loads((root/"state.json").read_text())
          assert git_state.verify_manifest(manifest,game.path)
          report=verification.audit(game)
          assert report["revision"]>=217 and report["session"]>=3 and report["compacted_sessions"]>=2
          assert report["at"]>="0006-09-26T09:28:19" and not report["pending"]
          scene=game.entry("turn","s2.played.153",audience="gm")
          assert "В-7" in scene["text"] and "Нори" in scene["text"]
          recent=game.context(audience="gm",recent=1)["recent"][-1]
          assert recent["text"]==game.entry("turn",recent["id"],audience="gm")["text"]
          found=game.search("контейнер",audience="gm")
          assert found
          with game.connection() as c:
              counts=compaction.audit(c,root)
              for s in (1,2):
                  assert len(sessions.export_session(c,s)) > 1000000
          print("ACCEPTED",{"report":report,"byte_size":game.path.stat().st_size,
                            "archive":counts,"last_turn_restored":len(scene["text"])})
          PY
