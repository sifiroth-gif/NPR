name: Shiki live memory fold

# Ведущий записывает один маленький recovery/TURN.json на ход.
# Этот процесс сворачивает его в recovery/HOT.json, recovery/GM_ONLY.json,
# дословный журнал archive/session-NNN-turns.jsonl, хронику и карточки NPC.
# Коммиты, сделанные GITHUB_TOKEN, новых запусков не вызывают: петли нет.
# Смысловой слой памяти (rpg_engine/meaning.py): модель e5-small закреплённой
# ревизии кешируется; без неё поиск идёт только по словам.

on:
  push:
    branches: ["game-state/shiki"]
    paths:
      - ".github/workflows/npr-live-memory.yml"
      - "recovery/TURN.json"
      - "recovery/GATE_POLICY.json"
      - "recovery/ENTITY_SEED_GM_ONLY.json"
      - "recovery/FAST_SCENE.json"
      - "recovery/ZERO.json"
      - "recovery/SESSION_CLOSE.json"
      - "recovery/MEMORY_TRIM.json"
      - "recovery/RECALL.json"
  workflow_dispatch:
    inputs:
      meaning_budget:
        description: "Сколько кусков истории закодировать по смыслу за запуск (полная сборка — 100000)"
        default: "48"
      probe:
        description: "Пробный вопрос к памяти: ответ только в журнал запуска"
        default: ""

permissions:
  contents: write

concurrency:
  group: npr-shiki-game-state-write
  cancel-in-progress: false

jobs:
  fold:
    if: github.repository == 'sifiroth-gif/NPR'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: _engine
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: game-state/shiki
          path: _state
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _engine/requirements-meaning.txt
      - name: Meaning runtime (optional)
        continue-on-error: true
        run: pip install --disable-pip-version-check -q -r _engine/requirements-meaning.txt
      - name: Meaning model cache
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: .npr-meaning
          key: npr-meaning-e5small-ffdcc22a
      - name: Meaning model (optional)
        id: model-fetch
        if: steps.model-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/_engine
        run: python -m rpg_engine meaning-fetch --dir .npr-meaning
      - name: Keep the model
        if: steps.model-cache.outputs.cache-hit != 'true' && steps.model-fetch.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .npr-meaning
          key: npr-meaning-e5small-ffdcc22a
      - name: Fold turns into HOT, verbatim log, chronicle and cast cards
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/_engine
          NPR_MEANING_MODEL: ${{ github.workspace }}/.npr-meaning
          NPR_MEANING_BUDGET: ${{ inputs.meaning_budget || '48' }}
          PROBE: ${{ inputs.probe }}
        run: |
          set -euo pipefail
          git -C _state config user.name "github-actions[bot]"
          git -C _state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git -C _state fetch origin refs/heads/game-state/shiki
            git -C _state checkout -B game-state/shiki FETCH_HEAD
            python -m rpg_engine hot-fold --state-dir _state | tee "$RUNNER_TEMP/fold.json"
            python -m rpg_engine hot-check --state-dir _state | tee "$RUNNER_TEMP/check.json"
            python -m rpg_engine.recall_audit _state | tee "$RUNNER_TEMP/recall-audit.json"
            # Legacy SQLite/search catalog is rebuilt only at intersession handoff,
            # never on every live-chat turn. HOT v2 holds all current play state.
            # A rejected turn publishes ONLY the refusal (HOT.fold.errors and
            # recovery/CHECKS.json), so the GM sees it instead of a silent stall.
            # A failed state check after a clean fold discards the fold and publishes
            # ONLY the failure in recovery/CHECKS.json (state_errors): the GM must
            # see that memory stopped updating. Turns stay in git history and are
            # folded by the next successful run.
            mode=$(python - "$RUNNER_TEMP/fold.json" "$RUNNER_TEMP/check.json" <<'PY'
          import json, sys
          fold, check = (json.load(open(p)) for p in sys.argv[1:3])
          print("rejected" if fold["errors"] else "broken" if not check["ok"] else "ok")
          PY
            )
            cursor=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['cursor'])" "$RUNNER_TEMP/fold.json")
            if [ "$mode" = broken ]; then
              git -C _state reset -q --hard FETCH_HEAD
              git -C _state clean -q -fd -- recovery archive
              python -m rpg_engine hot-blocked --state-dir _state --check "$RUNNER_TEMP/check.json" --turn "$cursor" > /dev/null
              git -C _state add -- recovery/CHECKS.json recovery/NEXT.json
            else
              git -C _state add -A -- recovery/HOT.json recovery/GM_ONLY.json recovery/GM_BRIEF.json \
                recovery/CHECKS.json recovery/NEXT.json recovery/UNDO.GM_ONLY.json recovery/ENTITY_LEDGER_GM_ONLY.json recovery/GENERAL_MEMORY_GM_ONLY.json recovery/MEMORY_QUALITY_GM_ONLY.json recovery/PACE.json recovery/cast archive memory
            fi
            # Протокол ноль: ожидающая кодовая команда игрока. Сейчас только пробный
            # прогон — пишет recovery/ZERO_REPORT.md и гасит команду, игру не трогает.
            python -m rpg_engine protocol-zero --state-dir _state | tee "$RUNNER_TEMP/zero.json"
            for f in recovery/ZERO.json recovery/ZERO_REPORT.md recovery/MEMORY_TRIM.json recovery/LIMITS.json \
                     recovery/RECALL.json recovery/RECALL_ANSWER.json; do
              if [ -e "_state/$f" ]; then git -C _state add -- "$f"; fi
            done
            zero=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['result'])" "$RUNNER_TEMP/zero.json")
            # Закрытие сессии по заявке ведущего (recovery/SESSION_CLOSE.json): дословный журнал
            # в холодный архив, глубокая разгрузка памяти, NEXT нового номера. Сбой — только отчёт.
            closing=idle
            if [ "$mode" = ok ]; then
              python -m rpg_engine session-close --state-dir _state --pending | tee "$RUNNER_TEMP/close.json"
              closing=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['result'])" "$RUNNER_TEMP/close.json")
              if [ "$closing" != idle ]; then
                git -C _state add -A -- recovery archive memory campaign.sqlite state.json campaigns/shiki/continuity
              fi
            fi
            if git -C _state diff --cached --quiet; then
              echo "HOT_CURRENT"
              break
            fi
            if [ "$mode" = rejected ]; then
              git -C _state commit -q -m "Fold refused after $cursor: see recovery/CHECKS.json"
            elif [ "$mode" = broken ]; then
              git -C _state commit -q -m "Fold blocked at $cursor by state check: see recovery/CHECKS.json"
            elif [ "$closing" = closed ]; then
              git -C _state commit -q -m "Close session at $cursor: verbatim journal archived, memory consolidated"
            elif [ "$zero" != idle ]; then
              git -C _state commit -q -m "Protocol zero ($zero) at $cursor: see recovery/ZERO_REPORT.md"
            else
              git -C _state commit -q -m "Fold $cursor into HOT, log, cast cards and NPC memory"
            fi
            if git -C _state push origin HEAD:refs/heads/game-state/shiki; then
              echo "HOT_PUBLISHED $cursor"
              break
            fi
            if [ "$attempt" = 4 ]; then
              echo "::error::state branch kept moving, fold not published"
              exit 1
            fi
            echo "Concurrent state update, reloading"
            sleep 2
          done
          python -c "import json,sys;print('meaning:', json.load(open(sys.argv[1])).get('meaning'))" "$RUNNER_TEMP/fold.json"
          if [ -n "${PROBE:-}" ]; then
            python -m rpg_engine recall-ask "$PROBE" --state-dir _state --limit 5
          fi
          python - "$RUNNER_TEMP/fold.json" "$RUNNER_TEMP/check.json" <<'PY'
          import json, sys
          fold, check = (json.load(open(p)) for p in sys.argv[1:3])
          for line in fold["errors"]:
              print(f"::error::turn rejected: {line}")
          for line in check["problems"]:
              print(f"::error::state check: {line}")
          sys.exit(1 if fold["errors"] or not check["ok"] else 0)
          PY
