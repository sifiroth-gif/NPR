name: Shiki live memory fold

# Ведущий записывает один маленький recovery/TURN.json на ход.
# Этот процесс сворачивает его в recovery/HOT.json, recovery/GM_ONLY.json,
# GM-пакет включает динамику NPC по архивным карточкам и ближайшим срокам.
# Владелец мирового таймера — не обязательно NPC; тип проверяется по реестру.
# дословный журнал archive/session-NNN-turns.jsonl, хронику и карточки NPC.
# Коммиты, сделанные GITHUB_TOKEN, новых запусков не вызывают: петли нет.

on:
  push:
    branches: ["game-state/shiki"]
    paths:
      - ".github/workflows/npr-live-memory.yml"
      - "recovery/TURN.json"
      - "recovery/GATE_POLICY.json"
      - "recovery/ENTITY_SEED_GM_ONLY.json"
      - "recovery/FAST_SCENE.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: npr-shiki-game-state-write
  cancel-in-progress: false

jobs:
  fold:
    if: github.repository == 'sifiroth-gif/NPR'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: _engine
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: game-state/shiki
          path: _state
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fold turns into HOT, verbatim log, chronicle and cast cards
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/_engine
        run: |
          set -euo pipefail
          git -C _state config user.name "github-actions[bot]"
          git -C _state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git -C _state fetch origin refs/heads/game-state/shiki
            git -C _state checkout -B game-state/shiki FETCH_HEAD
            python -m rpg_engine hot-fold --state-dir _state | tee "$RUNNER_TEMP/fold.json"
            python -m rpg_engine hot-check --state-dir _state | tee "$RUNNER_TEMP/check.json"
            python -m rpg_engine.recall_audit _state | tee "$RUNNER_TEMP/recall-audit.json"
            # Legacy SQLite/search catalog is rebuilt only at intersession handoff,
            # never on every live-chat turn. HOT v2 holds all current play state.
            # A rejected turn publishes ONLY the refusal (HOT.fold.errors and
            # recovery/CHECKS.json), so the GM sees it instead of a silent stall.
            # A failed state check after a clean fold discards the fold and publishes
            # ONLY the failure in recovery/CHECKS.json (state_errors): the GM must
            # see that memory stopped updating. Turns stay in git history and are
            # folded by the next successful run.
            mode=$(python - "$RUNNER_TEMP/fold.json" "$RUNNER_TEMP/check.json" <<'PY'
          import json, sys
          fold, check = (json.load(open(p)) for p in sys.argv[1:3])
          print("rejected" if fold["errors"] else "broken" if not check["ok"] else "ok")
          PY
            )
            cursor=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['cursor'])" "$RUNNER_TEMP/fold.json")
            if [ "$mode" = broken ]; then
              git -C _state reset -q --hard FETCH_HEAD
              git -C _state clean -q -fd -- recovery archive
              python -m rpg_engine hot-blocked --state-dir _state --check "$RUNNER_TEMP/check.json" --turn "$cursor" > /dev/null
              git -C _state add -- recovery/CHECKS.json
            else
              git -C _state add -A -- recovery/HOT.json recovery/GM_ONLY.json recovery/GM_BRIEF.json \
                recovery/CHECKS.json recovery/ENTITY_LEDGER_GM_ONLY.json recovery/GENERAL_MEMORY_GM_ONLY.json recovery/MEMORY_QUALITY_GM_ONLY.json recovery/cast archive memory
            fi
            if git -C _state diff --cached --quiet; then
              echo "HOT_CURRENT"
              break
            fi
            if [ "$mode" = rejected ]; then
              git -C _state commit -q -m "Fold refused after $cursor: see recovery/CHECKS.json"
            elif [ "$mode" = broken ]; then
              git -C _state commit -q -m "Fold blocked at $cursor by state check: see recovery/CHECKS.json"
            else
              git -C _state commit -q -m "Fold $cursor into HOT, log, cast cards and NPC memory"
            fi
            if git -C _state push origin HEAD:refs/heads/game-state/shiki; then
              echo "HOT_PUBLISHED $cursor"
              break
            fi
            if [ "$attempt" = 4 ]; then
              echo "::error::state branch kept moving, fold not published"
              exit 1
            fi
            echo "Concurrent state update, reloading"
            sleep 2
          done
          python - "$RUNNER_TEMP/fold.json" "$RUNNER_TEMP/check.json" <<'PY'
          import json, sys
          fold, check = (json.load(open(p)) for p in sys.argv[1:3])
          for line in fold["errors"]:
              print(f"::error::turn rejected: {line}")
          for line in check["problems"]:
              print(f"::error::state check: {line}")
          sys.exit(1 if fold["errors"] or not check["ok"] else 0)
          PY
