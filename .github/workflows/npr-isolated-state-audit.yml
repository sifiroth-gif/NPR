name: NPR isolated state audit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/npr-isolated-state-audit.yml"
      - "rpg_engine/capabilities.py"
      - "rpg_engine/nextpack.py"
      - "rpg_engine/preflight.py"
      - "rpg_engine/historical_regression.py"
      - "rpg_engine/hot.py"
      - "rpg_engine/continuity_guard.py"
      - "rpg_engine/identity.py"
      - "rpg_engine/dread.py"
      - "rpg_engine/medical.py"
      - "rpg_engine/body.py"
      - "rpg_engine/news.py"
      - "rpg_engine/will.py"
      - "rpg_engine/obligations.py"
      - "rpg_engine/aging.py"
      - "rpg_engine/fight.py"
      - "skills/dark-literary-gm/SKILL.md"
      - "rpg_engine/directives.py"
      - "rpg_engine/history_access.py"
      - "rpg_engine/acquaint.py"
      - "rpg_engine/echo.py"
      - "rpg_engine/npc_memory.py"
      - "campaigns/shiki/ref/DIRECTIVE_MIGRATION.json"
      - "campaigns/shiki/ref/CAPABILITIES.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: engine
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: caa812cad7c00dae5337d32ba58756013917b209
          path: state
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fold pinned s14.text.023 snapshot without publishing
        env:
          PYTHONPATH: ${{ github.workspace }}/engine
          NPR_MEANING_BUDGET: "0"
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          from rpg_engine import hot, fight, capabilities, nextpack
          state = Path("state")
          def load(path):
              return json.loads((state / path).read_text(encoding="utf-8"))
          def digest(path):
              return hashlib.sha256((state / path).read_bytes()).hexdigest()
          from rpg_engine import historical_regression
          archive_before = historical_regression.hashes(state)
          corpus = historical_regression.scan(state)
          print("D1_CORPUS", json.dumps(corpus, ensure_ascii=False))
          assert not corpus["errors"], corpus["errors"]
          original = load("recovery/HOT.json")
          original_will = load("recovery/GM_ONLY.json")["will"]
          assert original["cursor"]["id"] == "s14.text.023"
          protected = ["recovery/TURN.json", "archive/session-014-turns.jsonl",
                       "archive/deltas/session-014.jsonl",
                       "archive/npc-memory/chelovek_v_maske.json",
                       "archive/npc-memory/quay_masked_hunter.json",
                       "archive/session-008-turns.jsonl"]
          hashes = {p: digest(p) for p in protected}
          injuries = original.get("injuries")
          result = hot.fold(state)
          check = hot.check(state)
          print("FOLD", result["status"], "errors", len(result["errors"]), "applied", len(result["applied"]))
          print("CHECK", check["ok"], "problems", len(check["problems"]))
          assert not result["errors"] and not result["applied"], "Unexpected fold rejection or played turns"
          assert check["ok"], "State check failed"
          assert not result.get("wiki", {}).get("error"), "Wiki build failed"
          after = load("recovery/HOT.json")
          packet = load("recovery/NEXT.json")
          assert after["cursor"] == original["cursor"] and packet["cursor"] == original["cursor"]["id"]
          assert after.get("injuries") == injuries, "Existing injuries changed"
          assert "выключен" in after["shiki"]["eyes"] and "Шаринган выключен" in after["shiki"]["body"]
          assert all(digest(p) == v for p, v in hashes.items()), "Primary records changed"
          canonical = (state / "memory/npc/quay_masked_hunter.talk.md").read_text(encoding="utf-8")
          generic_path = state / "memory/npc/chelovek_v_maske.talk.md"
          generic = generic_path.read_text(encoding="utf-8") if generic_path.is_file() else ""
          for seq in ("001", "007", "008", "009", "011", "015"):
              ident = "s14.text." + seq
              assert ident in canonical and ident not in generic, "Dialogue attribution failed: " + ident
          generic_card = load("recovery/cast/chelovek_v_maske.json")
          assert not any(row["turn"].startswith("s14.") for row in generic_card.get("memory", []))
          assert packet["lag"]["recorded_turn"] == packet["cursor"]
          full, _ = hot._read_state(state)
          assert packet["dice"] == fight.dice(full)
          assert packet["lag"]["dice_for"] == packet["next_id"]
          data = capabilities.load(Path("engine"), full.get("campaign"))
          cap = packet["capabilities"]
          ids = {row["id"] for row in cap["items"] + cap["catalog"]}
          assert ids == {row["id"] for row in data["entries"]}
          archived_ids = {src for row in data["entries"] for src in row["sources"]
                          if capabilities.TURN_ID.fullmatch(src)}
          for ident in sorted(archived_ids):
              path = state / "archive/turns" / ident.split(".")[0] / (ident + ".md")
              assert path.is_file(), "Missing played capability source: " + ident
          packet_bytes = (state / "recovery/NEXT.json").stat().st_size
          assert packet_bytes <= nextpack.HARD_BYTES, "Expanded NEXT exceeded existing budget"
          print("B1_REGISTRY_OK", len(ids), "archived_sources", len(archived_ids), "NEXT_bytes", packet_bytes)
          assert packet["scene_context"]["as_of"] == original["scene"]["as_of"]
          assert "medical" in cap["scene_hint"]["routes"]
          assert packet["state_sources"]["medical_kit"]["turn"] == "s14.text.023"
          current = capabilities.for_request(data, "Магацухи", scene=original["scene"])
          assert "combat" in current["routes"] and "medical" not in current["routes"]
          assert "eyes.magatsuhi" in current["matched"]
          mixed = capabilities.for_request(data, "лечу рану, достаю инструменты и спрашиваю врача")
          assert {"medical", "items", "dialogue"} <= set(mixed["routes"])
          assert packet_bytes <= nextpack.TARGET_BYTES, "NEXT above target"
          assert packet_bytes == nextpack._size(packet)
          print("B2_ROUTING_OK", "NEXT_bytes", packet_bytes, "target", nextpack.TARGET_BYTES)
          from rpg_engine import directives
          seed = directives.standing(state)
          active = directives.active(state, full)
          view = packet["directives"]
          assert len(seed) == 18 and len(active) == 22
          assert len(view["standing_ids"]) == len(set(view["standing_ids"])) == 22
          assert all(row["text"] in view["standing"][i] for i, row in enumerate(active))
          assert set(row["id"] for row in seed) <= set(view["standing_ids"])
          assert all("s14.text.010" not in row for row in view.get("recent", []))
          assert all("s14.text.017" not in row for row in view.get("recent", []))
          assert all("s14.text.014" not in row and "s14.text.019" not in row for row in view.get("recent", []))
          print("B3_DIRECTIVES_OK", len(seed), "migrated", len(active)-len(seed), "active", len(active))
          from rpg_engine import acquaint, presence, identity, npc_memory, history_access
          names = presence.roster(state, full)
          met = acquaint.index(state, names)
          canonical_turns = set(met["quay_masked_hunter"]["spoke"])
          duplicate_turns = set(met.get("chelovek_v_maske", {}).get("spoke", []))
          rule = identity.active(state)[0]
          assert set(rule["speech_turns"]) <= canonical_turns, "Missing exact Minase dialogue"
          assert not set(rule["speech_turns"]) & duplicate_turns, "Duplicate acquaintance"
          assert not set(rule["duplicate_turns"]) & {x["turn"] for x in npc_memory.load_episodes(state, rule["from"])}
          assert acquaint.level(met, "quay_masked_hunter", 14)[0] <= 1, "Unexpected prior acquaintance"
          learned = capabilities.resolve(data, "стерилизация")
          assert learned["status"] == "mastered" and "s10.text.018" in learned["sources"]
          for ident in ("s10.text.018", "s11.text.074", "s13.text.100"):
              assert (state / "archive/turns" / ident.split(".")[0] / (ident + ".md")).is_file()
          print("B4_HISTORICAL_ACCESS_OK", "Minase exact speech", len(rule["speech_turns"]), "excluded duplicates", len(rule["duplicate_turns"]))
          from rpg_engine import dread
          assert "все заявленные действия" in packet["form"]
          assert "не квота эмоций" in packet["form"]
          assert "завершение" in packet["form"]
          sample = {"cast": {"a": {"name": "A"}, "b": {"name": "B"}}}
          dread.apply(sample, "a", {"saw": "known", "reads": "ordinary", "stage": 0}, "t1", "0010-04-11T21:30:00")
          dread.apply(sample, "b", {"saw": "known", "reads": "danger", "stage": 2}, "t1", "0010-04-11T21:30:00")
          dread.apply(sample, "a", {"saw": "known", "reads": "ordinary"}, "t2", "0010-04-11T21:30:01")
          assert sample["_psyche"]["a"]["dread"]["stage"] == 0
          assert sample["_psyche"]["b"]["dread"]["stage"] == 2
          print("C1_CONTRACT_OK", "independent_reactions", 2, "NEXT_bytes", packet_bytes)
          from rpg_engine import medical
          clinical = packet["medical"]
          minase = clinical["patients"]["quay_masked_hunter"]
          wounds = [dict(zip(clinical["fields"], row)) for row in minase["w"]]
          spinal = next(row for row in wounds if row["where"] == "спинной мозг")
          assert spinal["turn"] == "s14.text.007"
          assert spinal["recovered_at"] == "s14.text.023"
          assert spinal["bleed"] is False and "ходьба не проверена" in spinal["lost"]
          operator = clinical["patients"]["quay_wire_operator"]
          assert operator["loss"]["loss"] == 1 and any(row[4] is True for row in operator["w"])
          assert "fight" not in packet
          assert packet["state_sources"]["medical_kit"]["turn"] == "s14.text.023"
          assert "точный остаток" in packet["state_sources"]["medical_kit"]["state"]
          assert medical.context(full)["patients"]["quay_masked_hunter"]["wounds"] == full["injuries"]["quay_masked_hunter"]
          print("C2_MEDICAL_CONTEXT_OK", "patients", len(clinical["patients"]), "spinal_residual", spinal["recovered_at"], "NEXT_bytes", packet_bytes)
          from rpg_engine import news, obligations, will
          world = full["_will"]
          offer = world["news"]["current"]
          assert news.EVENT_ID.fullmatch(offer["id"])
          assert offer["legacy_offer"] is True
          assert packet["news_id"] == offer["id"]
          assert offer["id"] in world["obligations"]
          ids = packet.get("must_ids", []) + [row["id"] for row in packet.get("must_pending", {}).get("items", [])]
          assert len(ids) == len(set(ids))
          assert all(ident in world["obligations"] for ident in ids)
          assert world["news"]["delivered"] == original_will["news"]["delivered"]
          assert world["news"]["missed"] == original_will["news"]["missed"]
          print("C3_WORLD_AUTONOMY_OK", "obligations", len(ids), "legacy_offer_retained", True, "NEXT_bytes", packet_bytes)
          from rpg_engine import preflight
          assert packet["preflight"] == preflight.RULE
          probe = {"schema": "npr-turn/2", "id": packet["next_id"],
                   "at": packet["lag"]["at"], "place": packet["place"],
                   "player": "Где врач?", "gm": "**Мугами Шики:** — Где врач?",
                   "review": {"predecessor": packet["cursor"]},
                   "d": {"scene": {"present": list(full["scene"]["present"])}}}
          import copy
          before_probe = copy.deepcopy((packet, probe))
          check = preflight.inspect(packet, probe)
          assert check["mechanical_ok"], check
          assert len(check["checklist"]) == 6
          assert not preflight.inspect(packet, probe, used=["restricted.unlearned"])["mechanical_ok"]
          assert not preflight.inspect(packet, dict(probe, review={"predecessor": "s14.text.022"}))["mechanical_ok"]
          assert (packet, probe) == before_probe
          print("C4_PREFLIGHT_OK", "checklist", len(check["checklist"]), "NEXT_bytes", packet_bytes)
          regressions = historical_regression.verify(state, full, packet, data)
          print("D1_SCENARIOS", json.dumps(regressions, ensure_ascii=False))
          assert len(regressions) == 8 and all(regressions.values()), regressions
          historical_regression.check_hashes(state, archive_before)
          print("D1_PRIMARY_RECORDS_UNCHANGED", len(archive_before))
          print("A4_STATE_PROJECTION_OK")
          print("A5_FRESH_PACKET_OK")
          print("PRIMARY_RECORD_HASHES_UNCHANGED", len(hashes))
          print("PINNED_STATE_HEAD", subprocess.check_output(["git", "-C", str(state), "rev-parse", "HEAD"], text=True).strip())
          PY
